[metadata]
name = "jouleworkdarkfox"
author = "EdenEast"
origin_url = "https://github.com/EdenEast/nightfox.nvim"

[colors]
foreground = "#F1F2F4"
background = "#171A20"
cursor_bg = "#F1F2F4"
cursor_border = "#F1F2F4"
cursor_fg = "#171A20"
compose_cursor = '#b396f8'
selection_bg = "#2914A6"
selection_fg = "#F1F2F4"
scrollbar_thumb = "#7E879A"
split = "#0B0C0E"
visual_bell = "#F1F2F4"
ansi = ["#2914a6", "#cc44dd", "#f1f2f4", "#8080f7", "#8080f7", "#68aff9", "#8080f7", "#f1f2f4"]
brights = ["#4937b3", "#d460e2", "#f3f4f6", "#9393f8", "#9393f8", "#7fbbfa", "#9393f8", "#f3f4f6"]

[colors.indexed]
16 = "#cc44dd"
17 = "#b396f8"

[colors.tab_bar]
background = "#0B0C0E"
inactive_tab_edge = "#0B0C0E"
inactive_tab_edge_hover = "#0B0C0E"

[colors.tab_bar.active_tab]
bg_color = "#7E879A"
fg_color = "#171A20"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab]
bg_color = "#0B0C0E"
fg_color = "#F1F2F4"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#0E0637"
fg_color = "#F1F2F4"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab]
bg_color = "#171A20"
fg_color = "#F1F2F4"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab_hover]
bg_color = "#0E0637"
fg_color = "#F1F2F4"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

