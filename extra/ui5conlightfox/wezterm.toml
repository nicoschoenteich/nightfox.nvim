strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#ffffff"
fg_color = "#000000"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab]
bg_color = "#FFFFFF"
fg_color = "#000000"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab_hover]
bg_color = "#ffffff"
fg_color = "#000000"
intensity = "Normal"
italic = false
