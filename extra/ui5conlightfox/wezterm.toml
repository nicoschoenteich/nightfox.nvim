[metadata]
name = "ui5conlightfox"
author = "EdenEast"
origin_url = "https://github.com/EdenEast/nightfox.nvim"

[colors]
foreground = "#000000"
background = "#FFFFFF"
cursor_bg = "#000000"
cursor_border = "#000000"
cursor_fg = "#FFFFFF"
compose_cursor = '#0090da'
selection_bg = "#FFA42C"
selection_fg = "#000000"
scrollbar_thumb = "#646363"
split = "#F5F5F5"
visual_bell = "#000000"
ansi = ["#223548", "#ba066c", "#30914c", "#ffa42c", "#ff5d17", "#8838ec", "#3b4673", "#ffffff"]
brights = ["#435363", "#c42b82", "#4fa267", "#ffb24c", "#ff753a", "#9a56ef", "#586288", "#ffffff"]

[colors.indexed]
16 = "#ba066c"
17 = "#0090da"

[colors.tab_bar]
background = "#F5F5F5"
inactive_tab_edge = "#F5F5F5"
inactive_tab_edge_hover = "#F5F5F5"

[colors.tab_bar.active_tab]
bg_color = "#646363"
fg_color = "#FFFFFF"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab]
bg_color = "#F5F5F5"
fg_color = "#000000"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#F5F5F5"
fg_color = "#000000"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab]
bg_color = "#FFFFFF"
fg_color = "#000000"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab_hover]
bg_color = "#F5F5F5"
fg_color = "#000000"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

