[metadata]
name = "ui5conlightfox"
author = "EdenEast"
origin_url = "https://github.com/EdenEast/nightfox.nvim"

[colors]
foreground = "#000000"
background = "#FFFFFF"
cursor_bg = "#000000"
cursor_border = "#000000"
cursor_fg = "#FFFFFF"
compose_cursor = '#0090da'
selection_bg = "#ffba60"
selection_fg = "#000000"
scrollbar_thumb = "#646363"
split = "#ffffff"
visual_bell = "#000000"
ansi = ["#223548", "#ba066c", "#719f41", "#df8f25", "#e45314", "#8838ec", "#3b4673", "#ffffff"]
brights = ["#435363", "#c42b82", "#86ad5e", "#e4a046", "#e86d37", "#9a56ef", "#586288", "#ffffff"]

[colors.indexed]
16 = "#ba066c"
17 = "#0090da"

[colors.tab_bar]
