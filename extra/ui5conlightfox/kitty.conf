# Nightfox colors for Kitty
## name: ui5conlightfox
## upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/ui5conlightfox/kitty.conf

background #FFFFFF
foreground #000000
selection_background #FFA42C
selection_foreground #000000
cursor_text_color #FFFFFF
url_color #30914c

# Cursor
# uncomment for reverse background
# cursor none
cursor #000000

# Border
